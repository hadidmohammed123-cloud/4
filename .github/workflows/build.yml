
name: Build Naruto Mod Addon

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Find Gradle project
        id: project
        run: |
          BUILD_FILE=$(find . -name build.gradle -not -path '*/.gradle/*' -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "build.gradle not found!"
            exit 1
          fi
          BUILD_DIR=$(dirname "$BUILD_FILE")
          echo "Project directory: $BUILD_DIR"
          echo "project_dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"

      - name: Build mod
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle build --no-daemon

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: NarutoModAddon-fixed
          path: '**/build/libs/*.jar'
          if-no-files-found: error
